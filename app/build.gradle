apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

final Properties env = new Properties()
file("${rootDir}/env.properties").withInputStream { env.load(it) }

android {

    namespace 'juniojsv.mtk.easy.su'

    compileSdk 36

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "mtk-easy-su-v${defaultConfig.versionName}.apk"
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/key.jks")
            storePassword env['key.password']
            keyPassword env['key.password']
            keyAlias env['key.alias']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId 'juniojsv.mtk.easy.su'

        minSdkVersion 23
        targetSdkVersion 36

        versionCode 211
        versionName "2.2.2"
    }

    buildTypes {
        configureEach {
            resValue "string", "application_advertising_id",
                    env['application.advertising.id']

            resValue "string", "interstitial_advertising_id",
                    env['interstitial.advertising.id']

            resValue "string", "banner_advertising_id",
                    env['banner.advertising.id']

            resValue "string", "admob_test_device",
                    env['admob.test.device']
        }

        release {
            minifyEnabled true
            shrinkResources true

            proguardFiles(
                    getDefaultProguardFile(
                            'proguard-android-optimize.txt'
                    ),
                    'proguard-rules.pro'
            )

            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation fileTree(
            dir: 'libs',
            include: ['*.jar']
    )

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation 'androidx.core:core-ktx:1.16.0'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.google.android.gms:play-services-ads:24.1.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation platform(
            'com.google.firebase:firebase-bom:33.11.0'
    )

    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
}
